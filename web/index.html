<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>badge squirt</title>
  <!-- Oat (oat.ink): semantic, classless-ish UI kit. npm dependency served from node_modules;
       the Pages workflow copies these two files to the same path. -->
  <link rel="stylesheet" href="node_modules/@knadh/oat/oat.min.css">
  <script src="node_modules/@knadh/oat/oat.min.js" defer></script>
  <style>
    /* Only what Oat doesn't cover: the round preview, list rows, the debug log. Theme
       colours come from Oat's variables so light/dark follow the system automatically. */
    main.container { max-width: 760px; padding-block: var(--space-6) var(--space-12); display: grid; gap: var(--space-4); }
    h1 { margin: 0; font-size: var(--text-3); }
    h1 small { color: var(--muted-foreground); font-weight: var(--font-normal); font-size: var(--text-7); margin-inline-start: var(--space-2); }
    h3 { margin: 0; font-size: var(--text-5); }
    [hidden] { display: none !important; }
    .bad { color: var(--danger); font-weight: var(--font-semibold); }
    dl.info { display: grid; grid-template-columns: max-content 1fr; gap: var(--space-1) var(--space-4); margin: 0; font-size: var(--text-7); }
    dl.info dt { color: var(--muted-foreground); } dl.info dd { margin: 0; font-family: var(--font-mono); }
    /* pictures: list beside editor; stacks on narrow screens */
    .pictures { display: grid; grid-template-columns: minmax(200px, 1fr) auto; gap: var(--space-6); align-items: start; }
    @media (max-width: 720px) { .pictures { grid-template-columns: 1fr; } }
    ul.entries { display: grid; gap: var(--space-1); max-height: 440px; overflow: auto; margin: 0; }
    ul.entries li { display: grid; grid-template-columns: 48px 1fr auto; grid-template-rows: auto auto; gap: 0 var(--space-3); align-items: center;
                    padding: var(--space-1) var(--space-2); border-radius: var(--radius-medium); border: 1px solid transparent; cursor: pointer; }
    ul.entries li:hover { border-color: var(--border); }
    ul.entries li.selected { border-color: var(--ring); background: var(--accent); }
    ul.entries .thumb { grid-column: 1; grid-row: 1 / span 2; width: 48px; height: 48px; border-radius: var(--radius-full); object-fit: cover; background: #000; }
    ul.entries .name { grid-column: 2; grid-row: 1; font-size: var(--text-7); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    ul.entries .meta { grid-column: 2; grid-row: 2; font-size: var(--text-8); }
    ul.entries .remove { grid-column: 3; grid-row: 1 / span 2; }
    /* The panel is round, so the preview is too — you see exactly the crop the badge will show. */
    .drop { display: grid; place-items: center; width: 368px; height: 368px; max-width: 100%; aspect-ratio: 1; margin: 0 auto;
            border-radius: 50%; border: 2px dashed var(--border); overflow: hidden; background: #000; }
    .drop.loaded { cursor: grab; touch-action: none; user-select: none; }
    .drop.grabbing { cursor: grabbing; }
    .drop .preview { width: 100%; height: 100%; display: block; }
    .drop .hint { color: var(--muted-foreground); text-align: center; padding: var(--space-4); }
    .controls label { display: inline-flex; align-items: center; gap: var(--space-2); }
    input[type=range] { width: 160px; }
    .readout-row { min-height: 1.6em; font-size: var(--text-7); } /* reserved line so the sliders never shift */
    pre.log { margin: 0; max-height: 260px; overflow: auto; font-size: var(--text-8); line-height: 1.35; font-family: var(--font-mono);
              background: var(--muted); padding: var(--space-3); border-radius: var(--radius-medium); white-space: pre-wrap; word-break: break-all; }
    footer { color: var(--muted-foreground); font-size: var(--text-8); text-align: center; } footer a { color: inherit; }
  </style>
</head>
<body>
  <main class="container">
    <h1>badge squirt <small>push pictures to a DZBJ- badge over Web Bluetooth</small></h1>
    <p class="unsupported" role="alert" data-variant="danger" hidden>This browser has no Web Bluetooth. Use Chrome or Edge on https:// or localhost.</p>
    <section class="card"><badge-connect></badge-connect></section>
    <section class="card pictures">
      <image-list></image-list>
      <image-picker size="368,368"></image-picker>
    </section>
    <section class="card"><upload-progress></upload-progress></section>
    <section class="card"><debug-log></debug-log></section>
    <footer><a href="https://github.com/indrora/badge-squirt">indrora/badge-squirt</a> <span class="version"></span></footer>
  </main>
  <script type="module" src="dist/src/main.js"></script>
</body>
</html>
