<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>badge squirt</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f6f4; --fg: #1a1a1a; --muted: #666; --line: #d8d8d4; --accent: #4f46e5; --bad: #c0392b;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151517; --fg: #ececec; --muted: #9a9a9a; --line: #333; --accent: #8b83ff; --bad: #ff6b5b; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); }
    [hidden] { display: none !important; } /* our display:grid rules must not defeat the attribute */
    main { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; display: grid; gap: 1.25rem; }
    h1 { font-size: 1.4rem; margin: 0; }
    h1 small { color: var(--muted); font-weight: normal; font-size: .85rem; margin-left: .5rem; }
    section { border: 1px solid var(--line); border-radius: 10px; padding: 1rem; display: grid; gap: .75rem; }
    button { font: inherit; padding: .5rem .9rem; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    .status, .readout, .text { color: var(--muted); }
    .readout.bad { color: var(--bad); font-weight: 600; }
    dl.info { display: grid; grid-template-columns: max-content 1fr; gap: .2rem .75rem; margin: 0; font-size: .9rem; }
    dl.info dt { color: var(--muted); } dl.info dd { margin: 0; font-family: ui-monospace, monospace; }
    /* The panel is round, so the preview is too — you see exactly the crop the badge will show. */
    .drop { display: grid; place-items: center; width: 368px; height: 368px; max-width: 100%; aspect-ratio: 1;
            margin: 0 auto; border-radius: 50%; border: 2px dashed var(--line); overflow: hidden; cursor: pointer; background: #000; }
    .drop.over { border-color: var(--accent); }
    .drop .preview { width: 100%; height: 100%; object-fit: cover; }
    .drop .hint { color: var(--muted); text-align: center; padding: 1rem; }
    .controls { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; justify-content: center; }
    input[type=range] { width: 160px; vertical-align: middle; }
    progress { width: 100%; height: 10px; }
    pre.log { margin: 0; max-height: 260px; overflow: auto; font-size: .78rem; line-height: 1.35;
              background: rgba(127,127,127,.08); padding: .6rem; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
    .unsupported { color: var(--bad); }
  </style>
</head>
<body>
  <main>
    <h1>badge squirt <small>push a still image to a DZBJ- badge over Web Bluetooth</small></h1>
    <p class="unsupported" hidden>This browser has no Web Bluetooth. Use Chrome or Edge on https:// or localhost.</p>
    <section><badge-connect></badge-connect></section>
    <section><image-picker size="368,368"></image-picker></section>
    <section><upload-progress></upload-progress></section>
    <section><debug-log></debug-log></section>
  </main>
  <script type="module" src="dist/src/main.js"></script>
</body>
</html>
