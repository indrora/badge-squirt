<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>badge squirt</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f6f4; --fg: #1a1a1a; --muted: #666; --line: #d8d8d4; --accent: #4f46e5; --bad: #c0392b;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151517; --fg: #ececec; --muted: #9a9a9a; --line: #333; --accent: #8b83ff; --bad: #ff6b5b; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); }
    [hidden] { display: none !important; } /* our display:grid rules must not defeat the attribute */
    main { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; display: grid; gap: 1.25rem; }
    h1 { font-size: 1.4rem; margin: 0; }
    h1 small { color: var(--muted); font-weight: normal; font-size: .85rem; margin-left: .5rem; }
    section { border: 1px solid var(--line); border-radius: 10px; padding: 1rem; display: grid; gap: .75rem; }
    button { font: inherit; padding: .5rem .9rem; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    .status, .readout, .text { color: var(--muted); }
    .encoded-tag { color: var(--muted); font-size: .8rem; font-style: italic; }
    .bad { color: var(--bad); font-weight: 600; }
    .readout-row { min-height: 1.4em; } /* reserve the line so it never shifts the sliders */
    dl.info { display: grid; grid-template-columns: max-content 1fr; gap: .2rem .75rem; margin: 0; font-size: .9rem; }
    dl.info dt { color: var(--muted); } dl.info dd { margin: 0; font-family: ui-monospace, monospace; }
    /* The panel is round, so the preview is too — you see exactly the crop the badge will show. */
    .drop { display: grid; place-items: center; width: 368px; height: 368px; max-width: 100%; aspect-ratio: 1;
            margin: 0 auto; border-radius: 50%; border: 2px dashed var(--line); overflow: hidden; cursor: pointer; background: #000; }
    .drop.over { border-color: var(--accent); }
    .drop.loaded { cursor: grab; touch-action: none; user-select: none; }
    .drop.grabbing { cursor: grabbing; }
    .drop .preview { width: 100%; height: 100%; display: block; }
    button.reset, button.choose { padding: .3rem .7rem; font-size: .9rem; }
    .drop .hint { color: var(--muted); text-align: center; padding: 1rem; }
    .controls { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; justify-content: center; }
    input[type=range] { width: 160px; vertical-align: middle; }
    progress { width: 100%; height: 10px; }
    pre.log { margin: 0; max-height: 260px; overflow: auto; font-size: .78rem; line-height: 1.35;
              background: rgba(127,127,127,.08); padding: .6rem; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
    .unsupported { color: var(--bad); }
    /* pictures: list on the left, editor on the right; stacks on narrow screens */
    .pictures { grid-template-columns: minmax(200px, 1fr) auto; align-items: start; }
    @media (max-width: 680px) { .pictures { grid-template-columns: 1fr; } }
    ul.entries { list-style: none; margin: 0; padding: 0; display: grid; gap: .3rem; max-height: 440px; overflow: auto; }
    ul.entries li { display: grid; grid-template-columns: 48px 1fr auto; grid-template-rows: auto auto; gap: 0 .6rem; align-items: center;
                    padding: .3rem .4rem; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
    ul.entries li:hover { border-color: var(--line); }
    ul.entries li.selected { border-color: var(--accent); background: rgba(127,127,255,.08); }
    ul.entries .thumb { grid-row: 1 / span 2; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #000; }
    /* every cell pinned: with one item explicitly placed, auto-placement scrambled the rest */
    ul.entries .name { grid-column: 2; grid-row: 1; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    ul.entries .meta { grid-column: 2; grid-row: 2; font-size: .78rem; color: var(--muted); }
    ul.entries .remove { grid-column: 3; grid-row: 1 / span 2; padding: .2rem .5rem; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 680px) { .panels { grid-template-columns: 1fr; } }
    .panel { border: 1px solid var(--line); border-radius: 8px; padding: .75rem; display: grid; gap: .5rem; align-content: start; }
    .panel h3 { margin: 0; font-size: 1rem; }
    .panel .hint { margin: 0; font-size: .85rem; color: var(--muted); }
    footer { color: var(--muted); font-size: .8rem; text-align: center; } footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>badge squirt <small>push a still image to a DZBJ- badge over Web Bluetooth</small></h1>
    <p class="unsupported" hidden>This browser has no Web Bluetooth. Use Chrome or Edge on https:// or localhost.</p>
    <section><badge-connect></badge-connect></section>
    <section class="pictures">
      <image-list></image-list>
      <image-picker size="368,368"></image-picker>
    </section>
    <section><upload-progress></upload-progress></section>
    <section><debug-log></debug-log></section>
    <footer><a href="https://github.com/indrora/badge-squirt">indrora/badge-squirt</a> <span class="version"></span></footer>
  </main>
  <script type="module" src="dist/src/main.js"></script>
</body>
</html>
